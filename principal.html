<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="theme-color" content="#6c4cf5">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Juegos para dos</title>
<style>
:root{--bg:#f6f4ff;--card:#fff;--tx:#1d1b2e;--mu:#6b6885;--p1:#6c4cf5;--p2:#f5576c;--ok:#1fa971;--bad:#e5484d;--bd:#e3dff5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122a;--card:#201d3d;--tx:#f1efff;--mu:#a9a5c9;--bd:#35315c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14122a;--card:#201d3d;--tx:#f1efff;--mu:#a9a5c9;--bd:#35315c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:28px;margin:8px 0 4px;text-align:center}
.sub{color:var(--mu);text-align:center;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 4px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:14px;cursor:pointer}
.chip.on{background:var(--p1);color:#fff;border-color:var(--p1)}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--p1);color:#fff;font-size:17px;font-weight:700;cursor:pointer;margin-top:8px}
.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.score{display:flex;gap:10px;margin-bottom:12px}
.pl{flex:1;border-radius:14px;padding:10px 12px;background:var(--card);border:2px solid var(--bd);text-align:center}
.pl.act{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.pl b{display:block;font-size:13px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl span{font-size:28px;font-weight:800;color:var(--c)}
.pl small{display:block;font-size:12px;color:var(--mu)}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);margin-bottom:8px}
.q{font-size:20px;font-weight:700;margin:6px 0 14px;line-height:1.3}
.op{display:block;width:100%;text-align:left;padding:13px;margin-bottom:8px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;cursor:pointer}
.op:disabled{cursor:default;opacity:.35}
.op.ok{background:var(--ok);border-color:var(--ok);color:#fff;opacity:1}
.op.bad{background:var(--bad);border-color:var(--bad);color:#fff;opacity:1}
.btn:disabled{opacity:.4}
.fb{text-align:center;font-size:18px;font-weight:700;margin:6px 0}
.big{font-size:60px;text-align:center;margin:6px 0}
.reto{font-size:20px;text-align:center;font-weight:700;margin:10px 0 14px}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:360px;margin:12px auto}
.ttt button{aspect-ratio:1;border:2px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--p1);font-size:clamp(38px,12vw,64px);font-weight:800;cursor:pointer}
.ttt button:nth-child(2n){color:var(--p2)}
.ttt button:disabled{cursor:default}
.hpbar{height:12px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);overflow:hidden;margin:6px 0}
.hpbar i{display:block;height:100%;background:var(--ok);transition:width .25s,background .25s}
.battle-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.battle-actions .btn{margin-top:0;font-size:15px}
.hero-roster{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.hero-choice{border:2px solid var(--bd);border-radius:14px;padding:12px 8px;background:var(--bg);color:var(--tx);cursor:pointer;text-align:center}
.hero-choice.selected{border-color:var(--p1);box-shadow:0 0 0 2px color-mix(in srgb,var(--p1) 22%,transparent)}
.hero-choice:disabled{opacity:.55}
.hero-face{font-size:42px}
.hero-name{font-weight:800}
.hero-stats{font-size:12px;color:var(--mu);margin-top:4px}
.hero-combatants{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.hero-combatant{border:2px solid var(--bd);border-radius:14px;padding:10px 8px;text-align:center;background:var(--card);min-width:0}
.hero-combatant.active{border-color:var(--c)}
.hero-combatant .hero-face{font-size:38px}
.hero-team{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.hero-team button{border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);padding:6px;cursor:pointer;font-size:12px}
.hero-team button:disabled{opacity:.5;cursor:default}
.hero-summons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.hero-summons .hero-choice{padding:8px}
.hero-summons .hero-face{font-size:32px}

/* ========================================== */
/* MEJORAS VISUALES PARA LOS MODELOS 3D Y ARENA */
/* ========================================== */
.hero-arena{position:relative;overflow:hidden;padding:22px 12px 26px;border-radius:24px;background:radial-gradient(circle at 50% 40%,#4e3b9e 0%,#1e183b 60%,#0e0c1f 100%);perspective:800px;box-shadow:inset 0 0 30px rgba(108,76,245,0.25)}
.hero-arena:before{content:"";position:absolute;left:5%;right:5%;bottom:4px;height:55px;border-radius:50%;background:radial-gradient(ellipse at center,#a27bff88 0%,transparent 70%);filter:blur(10px);transform:rotateX(60deg)}
.hero-arena:after{content:"";position:absolute;left:10%;right:10%;bottom:-15px;height:110px;border-radius:50%;background:repeating-linear-gradient(90deg,transparent 0 40px,#ebd6ff18 41px 43px),repeating-linear-gradient(0deg,transparent 0 25px,#ebd6ff12 26px 28px);transform:rotateX(65deg);transform-origin:center top;pointer-events:none}
.hero-3d-scene{position:relative;z-index:1;width:100%;height:320px;touch-action:none;scroll-margin:20px}
.hero-3d-scene canvas{display:block;width:100%;height:100%;filter:drop-shadow(0 15px 15px rgba(0,0,0,0.4))}
.hero-3d-fallback{height:100%;display:grid;place-items:center;padding:20px;text-align:center;color:#fff;font-size:14px}

.hero-combatants{position:relative;z-index:1;transform-style:preserve-3d}
.hero-combatant{box-shadow:0 16px 22px #09071966;transform:rotateY(5deg) rotateX(4deg) translateZ(10px);transition:transform .3s cubic-bezier(0.175,0.885,0.32,1.275),box-shadow .3s,border-color .3s}
.hero-combatant:nth-child(2){transform:rotateY(-5deg) rotateX(4deg) translateZ(10px)}
.hero-combatant.active{transform:translateY(-6px) rotateY(0) rotateX(0) translateZ(36px) scale(1.04);box-shadow:0 24px 40px #7d52ff88}
.hero-combatant .hero-face{font-size:52px;text-shadow:0 8px 12px rgba(0,0,0,0.5)}
.hero-combatant.active .hero-face{display:inline-block;filter:drop-shadow(0 0 16px rgba(255,255,255,0.8));animation:hero-float 2s ease-in-out infinite}

.hero-fx-hit .hero-combatant.hero-effect-target{animation:hero-hit .7s cubic-bezier(.2,.8,.2,1)}
.hero-fx-miss .hero-combatant.hero-effect-target{animation:hero-miss .65s ease}
.hero-fx-switch .hero-combatant.hero-effect-target .hero-face{animation:hero-enter .8s cubic-bezier(.16,1,.3,1)}
.hero-fx-summon .hero-combatants{animation:hero-summon .9s ease}
.hero-fx-block .hero-combatants{animation:hero-block .7s ease}
.hero-fx-item .hero-combatants{animation:hero-item .7s ease}

.hero-combatants .hpbar{height:14px}
.hero-combatant{position:relative}
.hero-float{position:absolute;left:50%;top:4px;z-index:5;font-size:30px;font-weight:900;color:#ffe58a;text-shadow:0 0 10px #ff6b3f,0 2px 4px #000;pointer-events:none;animation:hero-float-up 1.2s ease-out forwards}
.hero-float.miss{font-size:20px;color:#cfd6ff;text-shadow:0 2px 4px #000}
@keyframes hero-float-up{0%{transform:translate(-50%,10px) scale(.6);opacity:0}20%{transform:translate(-50%,-6px) scale(1.25);opacity:1}100%{transform:translate(-50%,-48px) scale(1);opacity:0}}
.hero-spark{font-size:20px;letter-spacing:5px;color:#ffe58a;text-shadow:0 0 12px #ff9f3f}
.hero-mode-row{display:flex;gap:8px;margin:12px 0}
.hero-mode-row .chip{flex:1}
.hero-tips{display:flex;justify-content:space-around;gap:6px;color:#f5efff;font-size:12px;margin:12px 0}
.hero-action-wait{min-height:44px;animation:hero-wait-pulse .65s ease-in-out infinite alternate}

@keyframes hero-float{50%{transform:translateY(-8px) rotateY(10deg) scale(1.02)}}
@keyframes hero-hit{20%{transform:translateX(18px) rotateY(-20deg) scale(1.06);filter:brightness(1.6) saturate(1.3)}48%{transform:translateX(-14px) rotateY(14deg)}72%{transform:translateX(6px)}}
@keyframes hero-miss{18%{transform:translateX(-14px) rotateZ(-8deg)}42%{transform:translateX(14px) rotateZ(8deg)}68%{transform:translateX(-6px)}}
@keyframes hero-enter{0%{transform:translateY(35px) translateZ(-50px) rotateY(90deg) scale(0.3);opacity:0}65%{transform:translateY(-10px) translateZ(25px) rotateY(-15deg) scale(1.18);opacity:1}100%{transform:translateY(0) translateZ(0) rotateY(0) scale(1);opacity:1}}
@keyframes hero-summon{25%{filter:brightness(2) hue-rotate(45deg);transform:scale(1.1) rotateY(10deg)}60%{filter:brightness(1.4);transform:scale(0.96)}}
@keyframes hero-block{25%{filter:brightness(2);transform:translateZ(20px) scale(1.05)}55%{filter:brightness(1.4);transform:translateZ(-6px)}}
@keyframes hero-item{35%{filter:brightness(1.8) saturate(2);transform:scale(1.05)}}
@media(prefers-reduced-motion:reduce){.hero-combatant,.hero-combatant.active .hero-face,.hero-action-wait,.hero-fx-hit .hero-combatant.hero-effect-target,.hero-fx-miss .hero-combatant.hero-effect-target,.hero-fx-switch .hero-combatant.hero-effect-target .hero-face,.hero-fx-summon .hero-combatants,.hero-fx-block .hero-combatants,.hero-fx-item .hero-combatants{animation:none;transition:none}}
/* ========================================== */

.pen-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.pen-grid .btn{margin-top:0;font-size:15px;padding:12px 4px}.pen-goal{display:grid;grid-template-columns:repeat(3,1fr);border:4px solid #fff;border-bottom:0;border-radius:8px 8px 0 0;background:repeating-linear-gradient(90deg,#ffffff14 0 6px,transparent 6px 12px),#1d6b3a;margin:12px auto 0;max-width:340px}.pen-zone{height:84px;display:flex;align-items:center;justify-content:center;font-size:34px;border-right:2px dashed #ffffff44}.pen-zone:last-child{border-right:0}.pen-grass{height:10px;max-width:340px;margin:0 auto 12px;background:#2f8f4d;border-radius:0 0 8px 8px}.pen-3d{height:300px;border-radius:14px;overflow:hidden;background:linear-gradient(#8fd0ff 55%,#2f8f4d 55%)}.pen-3d canvas{display:block;width:100%;height:100%}.pen-reveal{animation:pen-reveal .01s linear 1.7s both}@keyframes pen-reveal{from{opacity:0}to{opacity:1}}.pen-marks{font-size:15px;letter-spacing:2px;min-height:22px}
.date-story{font-size:17px;line-height:1.65;margin:10px 0 18px}
.date-choice{text-align:left;line-height:1.4}
.date-progress{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin:12px 0}
.date-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--p1),var(--p2));transition:width .25s}
.code-symbols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.code-symbols button{padding:12px 6px;border:2px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font-size:27px;cursor:pointer}
.code-slots{display:flex;justify-content:center;gap:8px;margin:16px 0}
.code-slots button{width:58px;height:58px;border:2px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--p1);font-size:30px;font-weight:800;cursor:pointer}
.code-history{padding:10px 0;border-top:1px solid var(--bd)}

/* ===== Penales: UI y animaciones mejoradas ===== */
.pen-wrap{position:relative}
.pen-3d{box-shadow:0 10px 30px #0005;border:2px solid var(--bd)}
.pen-banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-4deg);font-weight:900;font-size:clamp(34px,11vw,56px);color:#fff;text-shadow:0 4px 0 #0006,0 0 24px currentColor;pointer-events:none;white-space:nowrap;animation:pen-pop .7s cubic-bezier(.2,1.6,.4,1) 1.6s backwards}
.pen-banner.goal{color:#ffd24b}.pen-banner.save{color:#6fd3ff}.pen-banner.miss{color:#ff8a8a}
@keyframes pen-pop{0%{transform:translate(-50%,-50%) rotate(-4deg) scale(0);opacity:0}100%{transform:translate(-50%,-50%) rotate(-4deg) scale(1);opacity:1}}
.pen-round{text-align:center;font-weight:800;font-size:14px;color:var(--mu);margin:0 0 8px}
.pen-dots{display:flex;gap:4px;justify-content:center;margin-top:6px;min-height:20px}
.pen-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--bd);font-size:10px;display:grid;place-items:center;font-style:normal;background:var(--bg)}
.pen-dot.g{background:var(--ok);border-color:var(--ok)}.pen-dot.s{background:#2e86de;border-color:#2e86de}.pen-dot.m{background:var(--bad);border-color:var(--bad)}
.pen-pow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 10px}
.pen-pow .chip{padding:10px;text-align:center;border-radius:12px;font-weight:700;line-height:1.3}
.pen-pow small{font-weight:400;opacity:.85}
.pen-aim{display:grid;grid-template-columns:repeat(3,1fr);border:4px solid #fff;border-bottom:0;border-radius:10px 10px 0 0;overflow:hidden;background:repeating-linear-gradient(90deg,#ffffff14 0 6px,transparent 6px 12px),#1d6b3a}
.pen-aim button{height:68px;border:0;border-right:2px dashed #ffffff55;background:transparent;color:#fff;font-size:14px;font-weight:800;cursor:pointer;transition:background .15s,transform .1s}
.pen-aim button:last-child{border-right:0}
.pen-aim button:hover,.pen-aim button:focus-visible{background:#ffffff33;outline:0}
.pen-aim button:active{transform:scale(.93)}
@media(prefers-reduced-motion:reduce){.pen-banner{animation:none}.pen-aim button{transition:none}}

/* ===== Batalla naval ===== */
.nv-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;padding:6px;border-radius:14px;background:linear-gradient(#1b5fa8,#0f3d78);max-width:360px;margin:8px auto;box-shadow:inset 0 0 18px #0006}
.nv-grid.sm{max-width:210px;gap:2px;padding:4px}
.nv-c{aspect-ratio:1;border:0;border-radius:6px;background:#ffffff1f;color:#fff;font-size:clamp(14px,4.5vw,22px);display:grid;place-items:center;padding:0;cursor:pointer;transition:background .15s}
.nv-grid.sm .nv-c{font-size:10px;cursor:default}
.nv-c:hover:not(:disabled){background:#ffffff4d}
.nv-c:disabled{cursor:default}
.nv-c.ship{background:#9aa6b8;box-shadow:inset 0 -3px #0004}
.nv-c.miss{background:#ffffff10}
.nv-c.hit{background:#e5484d}
.nv-c.sunk{background:#7a1f24}
.nv-c.new{animation:nv-pop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes nv-pop{0%{transform:scale(.2);filter:brightness(3)}100%{transform:scale(1);filter:none}}
.nv-lbl{text-align:center;font-size:13px;color:var(--mu);margin:8px 0 0}
@media(prefers-reduced-motion:reduce){.nv-c.new{animation:none}.nv-c{transition:none}}
.fut-pwr{height:10px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);overflow:hidden;margin:8px 0 0}
.fut-pwr i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1fa971,#ffd24b,#e5484d)}
.fut-ctl{display:flex;justify-content:space-between;align-items:center;margin:14px 6px 4px;-webkit-user-select:none;user-select:none;touch-action:none}
.fut-joy{position:relative;width:128px;height:128px;border-radius:50%;background:color-mix(in srgb,var(--p1) 14%,transparent);border:2px solid var(--p1);touch-action:none}
.fut-knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--p1);opacity:.85;pointer-events:none}
.fut-kick{width:112px;height:112px;border-radius:50%;border:0;background:var(--p2);color:#fff;font-size:42px;touch-action:none;box-shadow:0 8px 18px #0004;-webkit-user-select:none;user-select:none}
.fut-kick:active{transform:scale(.94)}
.fut-match{display:flex;flex-direction:column;gap:8px}
.fut-hud{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fut-hud h1{font-size:22px;white-space:nowrap}
.fut-hud .score{flex:1;margin:0}
.fut-hud .pl{padding:4px 8px}
.fut-hud .pl span{font-size:22px}
.fut-arena{min-width:0}
.fut-powers{display:flex;gap:8px}
.fut-powers .fut-pwr{flex:1}
.fut-controls{display:flex;flex-direction:column;gap:6px}
.fut-hint{margin:0;font-size:12px}
.fut-pause-btn{width:auto;margin:0;padding:9px 12px;white-space:nowrap}
.fut-pause-menu{display:none}
.fut-pause-menu.open{position:fixed;inset:0;z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;background:#10111dcc;color:#fff;backdrop-filter:blur(8px)}
.fut-pause-menu .btn{width:min(100%,300px);margin:0}
#fut-rotate{display:none}
.br-game{position:relative;width:100%;height:min(78vh,820px);min-height:520px;overflow:hidden;border:1px solid #ffffff44;border-radius:20px;background:#203d29;touch-action:none;user-select:none}
.br-canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.br-hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;color:#fff;text-shadow:0 2px 5px #000}
.br-hud-left,.br-hud-right{display:grid;gap:6px}
.br-hud-right{text-align:right}
.br-stat{padding:7px 10px;border:1px solid #ffffff66;border-radius:12px;background:#111b;font-size:13px;font-weight:800;backdrop-filter:blur(5px)}
.br-health{width:min(42vw,220px);height:12px;margin-top:4px;border:1px solid #ffffff99;border-radius:99px;background:#321b;overflow:hidden}
.br-health i{display:block;width:100%;height:100%;background:linear-gradient(90deg,#ff4b5c,#ffce4b,#2ee083);transition:width .15s}
.br-controls{position:absolute;inset:0;pointer-events:none}
.br-stick{position:absolute;width:132px;height:132px;border:2px solid #ffffffa8;border-radius:50%;background:#101827aa;box-shadow:0 5px 16px #0006;touch-action:none;pointer-events:auto}
.br-stick.move{left:16px;bottom:18px}
.br-stick.aim{right:20px;bottom:22px;width:108px;height:108px;opacity:.72}
.br-stick i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border:2px solid #fff;border-radius:50%;background:#6c4cf5e8;pointer-events:none}
.br-fire,.br-med,.br-reload{position:absolute;right:24px;bottom:145px;width:72px;height:72px;border:2px solid #ffffffbb;border-radius:50%;background:#e5484de8;color:#fff;font-size:30px;font-weight:900;box-shadow:0 5px 16px #0006;pointer-events:auto;touch-action:none}
.br-med{right:108px;bottom:157px;width:54px;height:54px;background:#1fa971e8;font-size:24px}
.br-reload{right:31px;bottom:227px;width:48px;height:42px;border-radius:13px;background:#182235e8;font-size:22px}
.br-pause{position:absolute;right:10px;top:10px;width:42px;height:42px;padding:0;border:1px solid #ffffff70;border-radius:12px;background:#111827ce;color:#fff;font-size:21px;pointer-events:auto}
.br-overlay{position:absolute;inset:0;display:grid;place-content:center;gap:10px;padding:24px;text-align:center;background:#101522ca;color:#fff;backdrop-filter:blur(5px)}
.br-overlay[hidden]{display:none}
.br-overlay h2{margin:0;font-size:clamp(28px,7vw,46px)}
.br-overlay p{margin:0 0 8px}
.br-overlay .btn{width:min(100%,300px);margin:0 auto}
.br-feed{position:absolute;left:10px;top:200px;display:grid;gap:3px;pointer-events:none;color:#fff;font-size:12px;font-weight:800;text-shadow:0 1px 3px #000}
.br-hitm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#ff4b4b;font-size:28px;font-weight:900;opacity:0;pointer-events:none;text-shadow:0 0 6px #000}
.br-arrow{position:absolute;left:50%;top:112px;transform:translateX(-50%);display:grid;justify-items:center;color:#9fd6ff;font-weight:900;text-shadow:0 1px 4px #000;pointer-events:none;z-index:2}

 CP.on("open",function(){CCONN=CP.connect(codeRoomPeerId(room),{reliable:true});codeBindConnection(CCONN,"guest")});
 CP.on("error",function(error){CERROR=error.type=="peer-unavailable"?"No encontramos esa sala. Revisa el código o pide a tu amigo que la cree otra vez.":"No se pudo conectar ("+error.type+"). Comprueba internet e inténtalo otra vez.";draw()});

function codeBindConnection(connection,role){
 CCONN=connection;CROLE=role;
 connection.on("open",function(){
  CNETWORK=true;CERROR="";

   S.codeSecrets=[null,null];S.codePicker=[];S.codeSetupPlayer=0;S.codeStage="secretSetup";S.codeTurn=0;S.codeGuess=[];S.codeHistory=[[],[]];S.codeScans=[true,true];S.codeScanResult="";S.codeWinner=-1;codeSendState();

 });

 connection.on("error",function(){if(CCONN!==connection)return;CERROR="La conexión de la sala tuvo un problema. Vuelve a unirte.";draw()});

 else if(dir==P.shot)out=Math.random()<(strong?.5:.85)?"save":"goal";

 else out="goal";

function mpSetup(msg){
 var nm=(document.getElementById("mp-name")||{}).value||M.myName||"";mpStop();M.myName=nm;
 app.innerHTML='<h1>👥 Trivia para todos</h1><p class="sub">Online · de 2 a '+MP_MAX+' jugadores, cada uno desde su celular</p><div class="card"><label>Tu nombre</label><input id="mp-name" maxlength="14" value="'+esc(nm)+'"><button class="btn" onclick="mpHost()">➕ Crear sala</button><label style="margin-top:18px">Código de la sala</label><input id="mp-room" inputmode="numeric" maxlength="6" placeholder="6 cifras"><button class="btn" onclick="mpJoin()">🔗 Unirme</button>'+(msg?'<p class="fb" style="color:var(--bad)">'+esc(msg)+'</p>':'')+'<p class="sub" style="font-size:12px;margin-top:12px">'+MP_TOTAL+' preguntas · más puntos si respondes rápido. Todos necesitan internet.</p><button class="btn g" onclick="mpBack()">⚙️ Volver al menú</button></div>';
}
function mpBc(o){(M.peers||[]).forEach(function(p){try{p.c.send(o)}catch(e){}})}
function mpHost(){
 if(typeof Peer=="undefined")return mpSetup("No se pudo cargar PeerJS. Revisa tu internet.");
 var n=mpName(),code=String(Math.floor(100000+Math.random()*900000));
 mpStop();M={myName:n,role:"host",code:code,me:0,phase:"lobby",players:[{id:0,name:n,score:0}],peers:[],nextId:1,ans:{},pick:-1,done:0};
 MPP=new Peer("triviamulti-"+code,MPCFG);
 MPP.on("connection",function(c){c.on("data",function(d){mpHostData(c,d)});c.on("close",function(){mpDrop(c)});c.on("error",function(){mpDrop(c)})});
 MPP.on("error",function(er){mpSetup(er.type=="unavailable-id"?"Ese código está ocupado. Intenta de nuevo.":"No se pudo crear la sala ("+er.type+").")});
 MPP.on("open",mpRender);
}
function mpHostData(c,d){
 if(!d||typeof d!="object")return;
 var p=M.peers.find(function(x){return x.c===c});
 if(d.t=="hi"&&!p){
  if(M.phase!="lobby"||M.players.length>=MP_MAX){try{c.send({t:"full"})}catch(e){}return}
  var base=String(d.name||"Jugador").trim().slice(0,12)||"Jugador",nm=base,k=2;
  while(M.players.some(function(x){return x.name.toLowerCase()==nm.toLowerCase()}))nm=base+" "+(k++);
  var id=M.nextId++;M.peers.push({c:c,id:id});M.players.push({id:id,name:nm,score:0});
  try{c.send({t:"you",id:id})}catch(e){}
  mpBc({t:"lobby",players:M.players});mpRender();
 }else if(d.t=="a"&&p)mpRecord(p.id,d.k);
}
function mpDrop(c){
 var p=(M.peers||[]).find(function(x){return x.c===c});if(!p)return;
 M.peers=M.peers.filter(function(x){return x!==p});
 if(M.phase=="lobby")M.players=M.players.filter(function(x){return x.id!=p.id});
 else{var pl=M.players.find(function(x){return x.id==p.id});if(pl)pl.gone=true}
 mpBc({t:M.phase=="lobby"?"lobby":"gone",players:M.players});
 if(M.phase=="q"&&mpAllIn())mpReveal();else mpRender();
}
function mpAllIn(){return M.players.every(function(p){return p.gone||M.ans[p.id]})}
function mpGo(){
 if(M.role!="host"||M.phase!="lobby"||M.players.length<2)return;
 M.deck=shuf(Q).slice(0,MP_TOTAL).map(shq);M.i=0;M.players.forEach(function(p){p.score=0});mpAsk();
}
function mpAsk(){
 var q=M.deck[M.i];M.phase="q";M.ans={};M.t0=Date.now();M.pick=-1;M.done=0;M.rev=null;M.deadline=M.t0+MP_TIME*1000;
 M.q={i:M.i,n:MP_TOTAL,cat:q[0],text:q[1],opts:q[2]};
 mpBc({t:"q",i:M.i,n:MP_TOTAL,cat:q[0],text:q[1],opts:q[2],time:MP_TIME,players:M.players});
 clearTimeout(MPTO);MPTO=setTimeout(mpReveal,MP_TIME*1000+400);mpRender();
}
function mpRecord(id,k){
 k=+k;if(M.phase!="q"||M.ans[id]||!(k>=0&&k<=3))return;
 M.ans[id]={k:k,dt:Date.now()-M.t0};M.done=Object.keys(M.ans).length;
 mpBc({t:"p",done:M.done});
 if(mpAllIn())mpReveal();else mpRender();
}
function mpReveal(){
 if(M.phase!="q")return;clearTimeout(MPTO);
 var q=M.deck[M.i],picks={},gains={};
 M.players.forEach(function(p){var a=M.ans[p.id],g=0;if(a){picks[p.id]=a.k;if(a.k==q[3])g=100+Math.round(Math.max(0,MP_TIME*1000-a.dt)/(MP_TIME*10))}p.score+=g;gains[p.id]=g});
 M.phase="r";M.rev={correct:q[3],picks:picks,gains:gains};
 mpBc({t:"r",correct:q[3],picks:picks,gains:gains,players:M.players});mpRender();
}
function mpNext(){
 if(M.role!="host"||M.phase!="r")return;M.i++;
 if(M.i>=MP_TOTAL){M.phase="end";mpBc({t:"end",players:M.players});mpRender()}else mpAsk();
}
function mpPick(k){
 if(M.phase!="q"||M.pick>=0)return;M.pick=k;
 if(M.role=="host")mpRecord(0,k);else{try{MPC.send({t:"a",k:k})}catch(e){}mpRender()}
}
function mpJoin(){
 if(typeof Peer=="undefined")return mpSetup("No se pudo cargar PeerJS. Revisa tu internet.");
 var n=mpName(),room=(document.getElementById("mp-room").value||"").trim();
 if(!/^\d{6}$/.test(room))return mpSetup("Escribe un código de 6 cifras.");
 mpStop();M={myName:n,role:"guest",phase:"conn",players:[],me:-1,pick:-1,done:0};
 app.innerHTML='<h1>📡 Conectando…</h1><div class="card"><p class="reto">Buscando la sala '+room+'</p><button class="btn g" onclick="mpSetup()">Cancelar</button></div>';
 MPP=new Peer(MPCFG);
 MPP.on("open",function(){
  MPC=MPP.connect("triviamulti-"+room,{reliable:true});
  MPC.on("open",function(){MPC.send({t:"hi",name:n})});
  MPC.on("data",mpGuestData);
  MPC.on("close",function(){if(M.role=="guest"&&M.phase!="end")mpSetup("Se perdió la conexión con la sala.")});
 });
 MPP.on("error",function(er){mpSetup(er.type=="peer-unavailable"?"No encontramos esa sala. Revisa el código.":"No se pudo conectar ("+er.type+").")});
}
function mpGuestData(d){
 if(!d||typeof d!="object")return;
 if(d.t=="full")return mpSetup("La sala está llena o la partida ya empezó.");
 if(d.t=="you")M.me=d.id;
 else if(d.t=="lobby"){M.phase="lobby";M.players=d.players}
 else if(d.t=="gone")M.players=d.players;
 else if(d.t=="q"){M.phase="q";M.q=d;M.players=d.players;M.pick=-1;M.done=0;M.rev=null;M.deadline=Date.now()+d.time*1000}
 else if(d.t=="p")M.done=d.done;
 else if(d.t=="r"){M.phase="r";M.rev=d;M.players=d.players}
 else if(d.t=="end"){M.phase="end";M.players=d.players}
 else return;
 if(M.phase!="conn")mpRender();
}
function mpBoard(P){
 var s=P.slice().sort(function(a,b){return b.score-a.score});
 return '<div style="margin-top:10px">'+s.map(function(p){var g=M.rev.gains[p.id];return '<div class="fb" style="font-size:15px">'+esc(p.name)+(p.id==M.me?' ⭐':'')+(p.gone?' (salió)':'')+': '+p.score+' pts'+(g?' <span style="color:var(--ok)">+'+g+'</span>':'')+'</div>'}).join('')+'</div>';
}
function mpRender(){
 clearInterval(MPTI);var h,ph=M.phase,P=M.players||[],host=M.role=="host";
 if(ph=="lobby"){
  h='<h1>👥 Sala de espera</h1><div class="card">'+(host?'<div class="big">🔑</div><div class="reto">Código: <strong>'+M.code+'</strong></div><p class="sub">Compártelo con tus amigos (hasta '+MP_MAX+' jugadores).</p>':'<p class="reto">Conectado ✅</p>')+'<p class="sub" style="margin-bottom:6px">Jugadores ('+P.length+'/'+MP_MAX+')</p>'+P.map(function(p){return '<div class="fb">'+(p.id==M.me?'⭐ ':'🙂 ')+esc(p.name)+'</div>'}).join('')+(host?(P.length>=2?'<button class="btn" onclick="mpGo()">▶ Empezar con '+P.length+' jugadores</button>':'<p class="sub">Esperando al menos a otro jugador…</p>'):'<p class="sub">Esperando a que el anfitrión empiece…</p>')+'<button class="btn g" onclick="mpBack()">Salir</button></div>';
 }else if(ph=="q"||ph=="r"){
  var q=M.q,rv=M.rev;
  h='<h1>👥 Pregunta '+(q.i+1)+'/'+q.n+'</h1><div class="card"><div class="sub">'+(E[q.cat]||"")+' '+esc(q.cat)+(ph=="q"?' · <b id="mp-t"></b>':'')+'</div><div class="reto">'+esc(q.text)+'</div>'+q.opts.map(function(o,k){
   var st='',mark='';
   if(ph=="r"){if(k==rv.correct){st=' style="border-color:var(--ok)"';mark=' ✅'}else if(k==M.pick){st=' style="border-color:var(--bad)"';mark=' ❌'}}
   else if(k==M.pick){st=' style="border-color:var(--p1)"';mark=' 👈'}
   return '<button class="btn g"'+st+(ph=="q"&&M.pick<0?' onclick="mpPick('+k+')"':' disabled')+'>'+esc(o)+mark+'</button>';
  }).join('');
  if(ph=="q")h+='<p class="sub" style="margin-top:10px">'+(M.pick>=0?'Respuesta enviada ✅ · ':'')+M.done+'/'+P.filter(function(p){return !p.gone}).length+' ya respondieron</p>';
  else h+=mpBoard(P)+(host?'<button class="btn" onclick="mpNext()">'+(q.i+1>=q.n?'🏆 Ver resultados':'Siguiente ▶')+'</button>':'<p class="sub">El anfitrión pasará a la siguiente…</p>');
  h+='</div>';
 }else if(ph=="end"){
  var s=P.slice().sort(function(a,b){return b.score-a.score}),med=["🥇","🥈","🥉"];
  h='<h1>🏆 Resultados</h1><div class="card"><div class="big">🥇</div><div class="reto">¡Ganó '+esc(s[0].name)+'!</div>'+s.map(function(p,i){return '<div class="fb">'+(med[i]||(i+1)+'.')+' '+esc(p.name)+(p.id==M.me?' ⭐':'')+' — '+p.score+' pts</div>'}).join('')+'<button class="btn g" onclick="mpBack()">⚙️ Volver al menú</button></div>';
 }else return;
 app.innerHTML=h;
 if(ph=="q"){var f=function(){var e=document.getElementById("mp-t");if(e)e.textContent="⏱️ "+Math.max(0,Math.ceil((M.deadline-Date.now())/1000))+"s"};f();MPTI=setInterval(f,250)}
}
</script>
<script>
/* ===== DETECCIÓN DE DISPOSITIVO ===== */
(function(){var h=document.documentElement;
function dev(){var w=innerWidth,t=matchMedia("(pointer:coarse)").matches;
 h.style.setProperty("--vh",(innerHeight*.01)+"px");
 h.classList.remove("dev-phone","dev-tablet","dev-desktop","touch","mouse","land","port");
 h.classList.add(Math.min(w,innerHeight)<600&&t?"dev-phone":(t&&w<1100?"dev-tablet":"dev-desktop"),t?"touch":"mouse",w>innerHeight?"land":"port");
 var e=document.getElementById("pen-3d");if(e&&window.PEN3D&&PEN3D.ren){var W=e.clientWidth||340,H=e.clientHeight||300;PEN3D.ren.setSize(W,H,false);PEN3D.cam.aspect=W/H;PEN3D.cam.updateProjectionMatrix()}}
dev();addEventListener("resize",dev);addEventListener("orientationchange",function(){setTimeout(dev,250)});
if(window.visualViewport)visualViewport.addEventListener("resize",dev);
})();
</script>
<script>
/* ===== EXTRAS DE CELULAR: vibración leve y pantalla encendida ===== */
(function(){var touch=matchMedia("(pointer:coarse)").matches;if(!touch)return;
document.addEventListener("pointerdown",function(e){if(e.target.closest&&e.target.closest(".btn,.op,.chip,.nv-c")&&!e.target.closest("button:disabled")&&navigator.vibrate)try{navigator.vibrate(8)}catch(x){}},{passive:true});
var wl=null;function lock(){if(!navigator.wakeLock||wl||document.hidden)return;navigator.wakeLock.request("screen").then(function(l){wl=l;l.addEventListener("release",function(){wl=null})}).catch(function(){})}
document.addEventListener("pointerdown",lock,{passive:true,once:true});document.addEventListener("visibilitychange",function(){if(!document.hidden)lock()});
})();
</script>
</body></html>
